# This is a Declarative Automation Bundle definition for az_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: az_bundle
  uuid: d4e78617-b6b7-4a36-883a-f0fcbb84b68d

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405605930895208.8.azuredatabricks.net
    variables:
      catalog: ap_databricks_ws
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://adb-7405605930895208.8.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/abhilash.poladi@ctpsandbox.com to make sure we only have a single copy.
      root_path: /Workspace/Users/abhilash.poladi@ctpsandbox.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ap_databricks_ws
      schema: prod
    permissions:
      - user_name: abhilash.poladi@ctpsandbox.com
        level: CAN_MANAGE
