resources:
  jobs:
    db_job1:
      name: db_job1
      tasks:
        - task_key: run_bronze
          notebook_task:
            notebook_path: ../notebooks/bronze.py
            source: WORKSPACE
          job_cluster_key: Job_cluster
        - task_key: run_silver
          depends_on:
            - task_key: run_bronze
          notebook_task:
            notebook_path: ../notebooks/silver.py
            source: WORKSPACE
          job_cluster_key: Job_cluster
        - task_key: run_gold
          depends_on:
            - task_key: run_silver
          notebook_task:
            notebook_path: ../notebooks/gold.py
            source: WORKSPACE
          job_cluster_key: Job_cluster
      job_clusters:
        - job_cluster_key: Job_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 17.3.x-scala2.13
            azure_attributes:
              first_on_demand: 1
              spot_bid_max_price: -1
            node_type_id: Standard_D4ds_v5
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            enable_elastic_disk: true
            data_security_mode: DATA_SECURITY_MODE_DEDICATED
            runtime_engine: PHOTON
            kind: CLASSIC_PREVIEW
            is_single_node: true
      queue:
        enabled: true
